<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Forgot Password | PARAMCGWALABOTS</title>
    <meta name="description" content="Reset your PARAMCGWALABOTS account password">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    
    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Auth Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="bi bi-robot"></i> PARAMCGWALA<span class="accent">BOTS</span>
                </div>
                <h1 class="auth-title">Reset Password</h1>
                <p class="auth-subtitle">Enter your email address and we'll send you a link to reset your password</p>
            </div>
            
            <!-- Alert Message -->
            <div id="authAlert" class="auth-alert">
                <i class="bi bi-info-circle"></i>
                <span id="alertMessage"></span>
            </div>
            
            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="Enter your email"
                        required
                    >
                    <div id="emailError" class="error-message"></div>
                </div>
                
                <button type="submit" class="auth-btn" id="resetBtn">
                    <span class="btn-text">Send Reset Link</span>
                </button>
            </form>
            
            <!-- Auth Links -->
            <div class="auth-links">
                <p>Remember your password? <a href="login.php" class="auth-link"><strong>Sign in</strong></a></p>
                <p><a href="index.html" class="auth-link">Back to Home</a></p>
            </div>
        </div>
    </div>
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    
    <!-- Config -->
    <script src="js/supabase-config.js"></script>
    
    <!-- Auth Functions -->
    <script src="js/auth.js"></script>
    
    <!-- Page Script -->
    <script>
        // Show alert message
        function showAlert(message, type = 'info') {
            const alert = document.getElementById('authAlert');
            const alertMessage = document.getElementById('alertMessage');
            
            alert.className = `auth-alert ${type} show`;
            alertMessage.textContent = message;
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }
        
        // Handle forgot password form submission
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const resetBtn = document.getElementById('resetBtn');
            const btnText = resetBtn.querySelector('.btn-text');
            
            // Clear previous errors
            document.getElementById('emailError').classList.remove('show');
            document.getElementById('email').classList.remove('error');
            
            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('emailError').textContent = 'Please enter a valid email address';
                document.getElementById('emailError').classList.add('show');
                document.getElementById('email').classList.add('error');
                return;
            }
            
            // Show loading state
            resetBtn.classList.add('loading');
            btnText.textContent = 'Sending...';
            resetBtn.disabled = true;
            
            try {
                // Attempt to send reset email
                const result = await resetPassword(email);
                
                if (result.success) {
                    showAlert(result.message, 'success');
                    
                    // Disable form after success
                    document.getElementById('email').disabled = true;
                    resetBtn.classList.remove('loading');
                    btnText.textContent = 'Email Sent!';
                    resetBtn.disabled = true;
                } else {
                    showAlert(result.message, 'error');
                }
            } catch (error) {
                showAlert('An unexpected error occurred. Please try again.', 'error');
                console.error('Reset password error:', error);
            } finally {
                // Reset button state if not successful
                if (!resetBtn.disabled) {
                    resetBtn.classList.remove('loading');
                    btnText.textContent = 'Send Reset Link';
                    resetBtn.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
