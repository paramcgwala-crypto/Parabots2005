<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Sign Up | PARAMCGWALABOTS</title>
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    
    <meta name="description" content="Create your PARAMCGWALABOTS account to access courses, trading bots, and premium features.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    
    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Auth Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="bi bi-robot"></i> PARAMCGWALA<span class="accent">BOTS</span>
                </div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join thousands of traders learning automation and building profitable trading bots</p>
            </div>
            
            <!-- Alert Message -->
            <div id="authAlert" class="auth-alert">
                <i class="bi bi-info-circle"></i>
                <span id="alertMessage"></span>
            </div>
            
            <!-- Signup Form -->
            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input 
                        type="text" 
                        id="fullName" 
                        class="form-input" 
                        placeholder="Enter your full name"
                        required
                    >
                    <div id="fullNameError" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="Enter your email"
                        required
                    >
                    <div id="emailError" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="Create a strong password"
                            required
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword('password')">
                            <i class="bi bi-eye" id="passwordToggleIcon"></i>
                        </button>
                    </div>
                    <div id="passwordError" class="error-message"></div>
                    <div id="passwordStrength" class="password-strength"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            class="form-input" 
                            placeholder="Confirm your password"
                            required
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                            <i class="bi bi-eye" id="confirmPasswordToggleIcon"></i>
                        </button>
                    </div>
                    <div id="confirmPasswordError" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label class="remember-me">
                        <input type="checkbox" id="agreeTerms" required>
                        <label for="agreeTerms">I agree to the <a href="#" class="auth-link">Terms of Service</a> and <a href="#" class="auth-link">Privacy Policy</a></label>
                    </label>
                </div>
                
                <button type="submit" class="auth-btn" id="signupBtn">
                    <span class="btn-text">Create Account</span>
                </button>
            </form>
            
            <!-- Divider -->
            <div class="auth-divider">
                <span>or sign up with</span>
            </div>
            
            <!-- Social Login -->
            <div class="social-login">
                <button type="button" class="social-btn" onclick="handleGoogleLogin()">
                    <i class="bi bi-google"></i>
                    Google
                </button>
                <button type="button" class="social-btn" onclick="handleGithubLogin()">
                    <i class="bi bi-github"></i>
                    GitHub
                </button>
            </div>
            
            <!-- Auth Links -->
            <div class="auth-links">
                <p>Already have an account? <a href="login.php" class="auth-link"><strong>Sign in</strong></a></p>
                <p><a href="index.html" class="auth-link">Back to Home</a></p>
            </div>
        </div>
    </div>
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    
    <!-- Config -->
    <script src="js/supabase-config.js"></script>
    
    <!-- Auth Functions -->
    <script src="js/auth.js"></script>
    
    <!-- Page Script -->
    <script>
        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + 'ToggleIcon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
        
        // Show alert message
        function showAlert(message, type = 'info') {
            const alert = document.getElementById('authAlert');
            const alertMessage = document.getElementById('alertMessage');
            
            alert.className = `auth-alert ${type} show`;
            alertMessage.textContent = message;
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }
        
        // Password strength checker
        function checkPasswordStrength(password) {
            let strength = 0;
            
            if (password.length >= 8) strength += 1;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength += 1;
            if (password.match(/\d/)) strength += 1;
            if (password.match(/[^a-zA-Z\d]/)) strength += 1;
            
            return strength;
        }
        
        // Update password strength indicator
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strength = checkPasswordStrength(password);
            const strengthDiv = document.getElementById('passwordStrength');
            
            const levels = ['Very Weak', 'Weak', 'Fair', 'Good', 'Strong'];
            const colors = ['#ff4757', '#ff6b6b', '#ffa502', '#00F5D4', '#00F5D4'];
            
            if (password.length > 0) {
                strengthDiv.innerHTML = `
                    <div style="margin-top: 0.5rem; display: flex; align-items: center; gap: 0.5rem;">
                        <div style="flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;">
                            <div style="width: ${(strength / 4) * 100}%; height: 100%; background: ${colors[strength]}; transition: all 0.3s ease;"></div>
                        </div>
                        <span style="font-size: 0.75rem; color: ${colors[strength]};">${levels[strength]}</span>
                    </div>
                `;
            } else {
                strengthDiv.innerHTML = '';
            }
        });
        
        // Handle signup form submission
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;
            const signupBtn = document.getElementById('signupBtn');
            const btnText = signupBtn.querySelector('.btn-text');
            
            // Clear previous errors
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));
            
            // Validate full name
            if (fullName.length < 2) {
                document.getElementById('fullNameError').textContent = 'Please enter your full name';
                document.getElementById('fullNameError').classList.add('show');
                document.getElementById('fullName').classList.add('error');
                return;
            }
            
            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('emailError').textContent = 'Please enter a valid email address';
                document.getElementById('emailError').classList.add('show');
                document.getElementById('email').classList.add('error');
                return;
            }
            
            // Validate password
            if (password.length < 8) {
                document.getElementById('passwordError').textContent = 'Password must be at least 8 characters';
                document.getElementById('passwordError').classList.add('show');
                document.getElementById('password').classList.add('error');
                return;
            }
            
            if (checkPasswordStrength(password) < 2) {
                document.getElementById('passwordError').textContent = 'Password is too weak. Please include uppercase, lowercase, numbers, and special characters.';
                document.getElementById('passwordError').classList.add('show');
                document.getElementById('password').classList.add('error');
                return;
            }
            
            // Validate confirm password
            if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
                document.getElementById('confirmPasswordError').classList.add('show');
                document.getElementById('confirmPassword').classList.add('error');
                return;
            }
            
            // Validate terms agreement
            if (!agreeTerms) {
                showAlert('Please agree to the Terms of Service and Privacy Policy', 'error');
                return;
            }
            
            // Show loading state
            signupBtn.classList.add('loading');
            btnText.textContent = 'Creating Account...';
            signupBtn.disabled = true;
            
            try {
                // Attempt sign up
                const result = await signUp(email, password, {
                    full_name: fullName,
                    created_at: new Date().toISOString()
                });
                
                if (result.success) {
                    showAlert(result.message, 'success');
                    
                    if (result.requiresConfirmation) {
                        // Redirect to login page with message
                        setTimeout(() => {
                            window.location.href = `login.php?message=${encodeURIComponent(result.message)}&type=success`;
                        }, 2000);
                    } else {
                        // Redirect to dashboard
                        setTimeout(() => {
                            window.location.href = 'dashboard.php';
                        }, 1000);
                    }
                } else {
                    showAlert(result.message, 'error');
                }
            } catch (error) {
                showAlert('An unexpected error occurred. Please try again.', 'error');
                console.error('Signup error:', error);
            } finally {
                // Reset button state
                signupBtn.classList.remove('loading');
                btnText.textContent = 'Create Account';
                signupBtn.disabled = false;
            }
        });
        
        // Handle Google login (placeholder - requires Supabase OAuth setup)
        function handleGoogleLogin() {
            showAlert('Google login will be available after OAuth setup in Supabase.', 'info');
        }
        
        // Handle GitHub login (placeholder - requires Supabase OAuth setup)
        function handleGithubLogin() {
            showAlert('GitHub login will be available after OAuth setup in Supabase.', 'info');
        }
    </script>
</body>
</html>
