<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Login | PARAMCGWALABOTS</title>
    <meta name="description" content="Login to your PARAMCGWALABOTS account to access courses, trading bots, and premium features.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    
    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Auth Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="bi bi-robot"></i> PARAMCGWALA<span class="accent">BOTS</span>
                </div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to access your courses, trading bots, and premium features</p>
            </div>
            
            <!-- Alert Message -->
            <div id="authAlert" class="auth-alert">
                <i class="bi bi-info-circle"></i>
                <span id="alertMessage"></span>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="Enter your email"
                        required
                    >
                    <div id="emailError" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="Enter your password"
                            required
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword('password')">
                            <i class="bi bi-eye" id="passwordToggleIcon"></i>
                        </button>
                    </div>
                    <div id="passwordError" class="error-message"></div>
                </div>
                
                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </label>
                    <a href="forgot-password.php" class="forgot-password">Forgot password?</a>
                </div>
                
                <button type="submit" class="auth-btn" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                </button>
            </form>
            
            <!-- Divider -->
            <div class="auth-divider">
                <span>or continue with</span>
            </div>
            
            <!-- Social Login -->
            <div class="social-login">
                <button type="button" class="social-btn" onclick="handleGoogleLogin()">
                    <i class="bi bi-google"></i>
                    Google
                </button>
                <button type="button" class="social-btn" onclick="handleGithubLogin()">
                    <i class="bi bi-github"></i>
                    GitHub
                </button>
            </div>
            
            <!-- Auth Links -->
            <div class="auth-links">
                <p>Don't have an account? <a href="signup.php" class="auth-link"><strong>Sign up</strong></a></p>
                <p><a href="index.html" class="auth-link">Back to Home</a></p>
            </div>
        </div>
    </div>
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    
    <!-- Config -->
    <script src="js/supabase-config.js"></script>
    
    <!-- Auth Functions -->
    <script src="js/auth.js"></script>
    
    <!-- Page Script -->
    <script>
        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + 'ToggleIcon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
        
        // Show alert message
        function showAlert(message, type = 'info') {
            const alert = document.getElementById('authAlert');
            const alertMessage = document.getElementById('alertMessage');
            
            alert.className = `auth-alert ${type} show`;
            alertMessage.textContent = message;
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }
        
        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const btnText = loginBtn.querySelector('.btn-text');
            
            // Clear previous errors
            document.getElementById('emailError').classList.remove('show');
            document.getElementById('passwordError').classList.remove('show');
            document.getElementById('email').classList.remove('error');
            document.getElementById('password').classList.remove('error');
            
            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('emailError').textContent = 'Please enter a valid email address';
                document.getElementById('emailError').classList.add('show');
                document.getElementById('email').classList.add('error');
                return;
            }
            
            // Validate password
            if (password.length < 6) {
                document.getElementById('passwordError').textContent = 'Password must be at least 6 characters';
                document.getElementById('passwordError').classList.add('show');
                document.getElementById('password').classList.add('error');
                return;
            }
            
            // Show loading state
            loginBtn.classList.add('loading');
            btnText.textContent = 'Signing in...';
            loginBtn.disabled = true;
            
            try {
                // Attempt sign in
                const result = await signIn(email, password);
                
                if (result.success) {
                    showAlert(result.message, 'success');
                    
                    // Redirect to dashboard or intended destination
                    const intendedDestination = sessionStorage.getItem('intendedDestination');
                    setTimeout(() => {
                        window.location.href = intendedDestination || 'dashboard.php';
                    }, 1000);
                } else {
                    showAlert(result.message, 'error');
                    
                    if (result.requiresConfirmation) {
                        // Show resend confirmation option
                        setTimeout(() => {
                            if (confirm('Would you like to resend the confirmation email?')) {
                                resendConfirmation(email);
                            }
                        }, 500);
                    }
                }
            } catch (error) {
                showAlert('An unexpected error occurred. Please try again.', 'error');
                console.error('Login error:', error);
            } finally {
                // Reset button state
                loginBtn.classList.remove('loading');
                btnText.textContent = 'Sign In';
                loginBtn.disabled = false;
            }
        });
        
        // Resend confirmation email
        async function resendConfirmation(email) {
            try {
                const result = await resendConfirmationEmail(email);
                if (result.success) {
                    showAlert(result.message, 'success');
                } else {
                    showAlert(result.message, 'error');
                }
            } catch (error) {
                showAlert('Failed to resend confirmation email.', 'error');
            }
        }
        
        // Handle Google login (placeholder - requires Supabase OAuth setup)
        function handleGoogleLogin() {
            showAlert('Google login will be available after OAuth setup in Supabase.', 'info');
        }
        
        // Handle GitHub login (placeholder - requires Supabase OAuth setup)
        function handleGithubLogin() {
            showAlert('GitHub login will be available after OAuth setup in Supabase.', 'info');
        }
        
        // Check for error/success messages from URL parameters
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const message = urlParams.get('message');
            const type = urlParams.get('type');
            
            if (message) {
                showAlert(decodeURIComponent(message), type || 'info');
                
                // Clean URL
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
    </script>
</body>
</html>
